name: Sync to service API change

# Chain B (consumer): the service's API contract changed (OpenAPI snapshot diff) ->
# repository_dispatch 'api-changed' lands here. Patch-bump the SDK and cut a release;
# the existing publish.yml (on release: published) ships it to PyPI.
on:
  repository_dispatch:
    types: [api-changed]
  workflow_dispatch:

concurrency:
  group: sync-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PAT so the release we create triggers publish.yml.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Patch-bump VERSION
        id: bump
        env:
          SERVICE_SHA: ${{ github.event.client_payload.service_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          vf = pathlib.Path("VERSION")
          maj, minr, pat = (int(x) for x in vf.read_text().strip().split("."))
          v = f"{maj}.{minr}.{pat + 1}"
          vf.write_text(v)
          sha = (os.environ.get("SERVICE_SHA") or "")[:7]
          cl = pathlib.Path("CHANGELOG.md")
          if cl.exists():
              c = cl.read_text()
              entry = (f"\n### Changed (auto) — service API contract changed ({v})\n"
                       f"- Auto patch-bump triggered by smart-memory-service API change"
                       f"{f' ({sha})' if sha else ''}. Review client coverage of new/changed fields.\n")
              if "## [Unreleased]" in c:
                  cl.write_text(c.replace("## [Unreleased]", "## [Unreleased]" + entry, 1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={v}\n")
          print(f"smartmemory-client -> {v}")
          PY

      - name: Commit, push, release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          V: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "smartmem-dev[bot]"
          git config user.email "smartmem-dev@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump to $V (service API contract changed)"
          git push origin HEAD:main
          gh release create "v$V" --title "v$V" --notes "Sync to smart-memory-service API change."
          echo "✅ Released smartmemory-client v$V (publish.yml will ship to PyPI)."
